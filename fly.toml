# Fly.io config. Room membership lives in process memory (lib/rooms.js),
# so this app must run as a single machine: `fly scale count 1`.
app = "scrumblr"
primary_region = "iad"

[build]
  dockerfile = "dockerfile"

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  # Stopping idle machines would drop open websockets
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 1000
    hard_limit = 1500

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
