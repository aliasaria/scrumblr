services:
  redis:
    image: redis:7
    container_name: "redis-dock"
    networks:
      - scrumblr-net
  node:
    build: .
    image: "scrumblr:latest"
    container_name: "scrumblr"
    environment:
      - REDIS_URL=redis://redis-dock:6379
    ports:
      - "8080:8080"
    depends_on:
      - redis
    networks:
      - scrumblr-net
networks:
  scrumblr-net:
    driver: bridge
    name: scrumblr-net
